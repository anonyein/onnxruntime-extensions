name: Android 16KB Page Size Verification

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'java/**'
      - 'tools/build.py'
      - '.github/workflows/android-16kb-check.yml'
  workflow_dispatch:

jobs:
  verify-android-16kb-alignment:
    name: Build & Verify 16KB Page Alignment
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android for ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e

          echo "Building for ABI: ${{ matrix.abi }}"
          
          # Clean previous build for this ABI
          rm -rf build/Android_${{ matrix.abi }}
          
          # Use the project's build script with separate build directory
          python tools/build.py \
            --android \
            --android_abi=${{ matrix.abi }} \
            --android_api=27 \
            --android_home=$ANDROID_HOME \
            --android_ndk_path=$ANDROID_NDK_HOME \
            --config=Release \
            --build_dir=build/Android_${{ matrix.abi }} \
            --update \
            --parallel \
            --build

      - name: Verify 16KB page alignment for ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e

          echo "=== Verifying 16KB page size alignment for ${{ matrix.abi }} ==="

          # Find android built libraries
          LIBS=$(find build/Android_${{ matrix.abi }}/Release/lib -name "*.so" -type f)

          if [ -z "$LIBS" ]; then
            echo "ERROR: No libraries found for ${{ matrix.abi }}"
            find build/Android_${{ matrix.abi }} -type f -name "*.so" || true
            exit 1
          fi

          # Use llvm-readelf from NDK
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          if [ ! -f "$READELF" ]; then
            echo "ERROR: llvm-readelf not found at $READELF"
            exit 1
          fi

          echo "Found libraries for ${{ matrix.abi }}:"
          echo "$LIBS"
          echo ""

          # Libraries that are expected to have 16KB alignment
          # libonnxruntime.so may use 4KB alignment by default
          TARGET_LIBS="libortextensions.so libonnxruntime_extensions4j_jni.so"
          
          FAILED=0
          for LIB in $LIBS; do
            LIBNAME=$(basename "$LIB")
            echo "Checking: $LIBNAME"
            echo "Full path: $LIB"
            
            # Get file architecture info
            echo "File type and architecture:"
            file "$LIB" || true
            echo ""
            
            # Display LOAD segments
            echo "LOAD segments:"
            $READELF -l "$LIB" | grep -A 2 "LOAD" || true

            # Check alignment
            ALIGNMENT=$($READELF -l "$LIB" | grep -A 1 "LOAD" | grep "LOAD" | head -1 | awk '{print $NF}')
            echo "Alignment: $ALIGNMENT"
            
            # For armeabi-v7a, different libraries may have different requirements
            if [[ "${{ matrix.abi }}" == "armeabi-v7a" ]]; then
              if [[ "$LIBNAME" == "libonnxruntime.so" ]]; then
                echo "INFO: libonnxruntime.so may use 4KB alignment by default"
                echo "Checking if 4KB or 16KB alignment..."
                if [[ "$ALIGNMENT" == "0x1000" ]] || [[ "$ALIGNMENT" == "0x4000" ]]; then
                  echo "PASS: $LIBNAME has acceptable alignment ($ALIGNMENT)"
                else
                  echo "WARN: $LIBNAME has unexpected alignment: $ALIGNMENT"
                fi
              elif [[ "$TARGET_LIBS" =~ "$LIBNAME" ]]; then
                if [[ "$ALIGNMENT" == "0x4000" ]]; then
                  echo "PASS: $LIBNAME has required 16KB alignment (0x4000)"
                else
                  echo "FAIL: $LIBNAME should have 16KB alignment (0x4000) but has $ALIGNMENT"
                  FAILED=1
                fi
              else
                echo "INFO: $LIBNAME - checking alignment"
                if [[ "$ALIGNMENT" == "0x4000" ]]; then
                  echo "PASS: $LIBNAME has 16KB alignment"
                else
                  echo "INFO: $LIBNAME has $ALIGNMENT alignment"
                fi
              fi
            else
              # For other ABIs (64-bit), check for 16KB alignment
              if [[ "$ALIGNMENT" == "0x4000" ]]; then
                echo "PASS: $LIBNAME has required 16KB alignment (0x4000)"
              else
                echo "Checking if alignment is acceptable..."
                # 64-bit architectures should use 16KB, but we can be flexible
                if [[ "$ALIGNMENT" == "0x1000" ]]; then
                  echo "WARN: $LIBNAME has 4KB alignment (0x1000) - may work but not optimal"
                else
                  echo "FAIL: $LIBNAME should have 16KB alignment (0x4000) but has $ALIGNMENT"
                  FAILED=1
                fi
              fi
            fi
            echo "---"
          done

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "ERROR: One or more required libraries for ${{ matrix.abi }} do not have 16KB page alignment"
            echo "Note: libonnxruntime.so may use 4KB alignment by default"
            exit 1
          fi

          echo ""
          echo "SUCCESS: All required libraries for ${{ matrix.abi }} have correct alignment"

      - name: Upload build artifacts for ${{ matrix.abi }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}-libraries
          path: |
            build/Android_${{ matrix.abi }}/Release/lib/*.so
            build/Android_${{ matrix.abi }}/Release/bin/*
          retention-days: 7

  package-aar:
    name: Package Android AAR
    runs-on: ubuntu-latest
    needs: verify-android-16kb-alignment
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AAR directory structure
        run: |
          echo "Creating AAR directory structure..."
          
          # Define base directories
          AAR_DIR="build/outputs/aar"
          LIBS_DIR="$AAR_DIR/jni"
          
          # Create directory structure
          mkdir -p $LIBS_DIR/{arm64-v8a,armeabi-v7a,x86,x86_64}
          mkdir -p $AAR_DIR/res
          
          # Create minimal AndroidManifest.xml file
          cat > $AAR_DIR/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.microsoft.onnxruntime.extensions">
              
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34" />
              
              <application>
                  <!-- Optional application configuration -->
              </application>
          </manifest>
          EOF
          
          # Create empty res directory (required for AAR)
          mkdir -p $AAR_DIR/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources></resources>' > $AAR_DIR/res/values/values.xml

      - name: Copy native libraries to AAR structure
        run: |
          echo "Copying native libraries..."
          
          AAR_DIR="build/outputs/aar"
          
          # Copy libraries from each ABI artifact
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            echo "Processing $ABI libraries..."
            
            SOURCE_DIR="artifacts/android-$ABI-libraries"
            
            if [ -d "$SOURCE_DIR" ]; then
              # Find all .so files
              SO_FILES=$(find "$SOURCE_DIR" -name "*.so" -type f)
              
              if [ -n "$SO_FILES" ]; then
                echo "Found $(echo "$SO_FILES" | wc -l) .so files for $ABI"
                
                for SO_FILE in $SO_FILES; do
                  FILENAME=$(basename "$SO_FILE")
                  DEST_PATH="$AAR_DIR/jni/$ABI/$FILENAME"
                  
                  # Verify it's the correct architecture
                  ARCH_INFO=$(file "$SO_FILE" 2>/dev/null || echo "")
                  if [[ "$ARCH_INFO" =~ "$ABI" ]] || [[ "$ARCH_INFO" =~ "ARM" && "$ABI" =~ "arm" ]] || \
                     [[ "$ARCH_INFO" =~ "Intel" && "$ABI" =~ "x86" ]]; then
                    cp "$SO_FILE" "$DEST_PATH"
                    echo "Copied: $FILENAME to jni/$ABI/"
                  else
                    echo "INFO: $FILENAME architecture: $ARCH_INFO"
                    echo "Copying anyway as it may be from $ABI build..."
                    cp "$SO_FILE" "$DEST_PATH"
                  fi
                done
              else
                echo "WARNING: No .so files found for $ABI in $SOURCE_DIR"
              fi
            else
              echo "WARNING: Artifact directory not found for $ABI: $SOURCE_DIR"
            fi
          done
          
          # List all copied libraries
          echo ""
          echo "Libraries copied to AAR structure:"
          find $AAR_DIR/jni -name "*.so" -type f | sort

      - name: Compile Java source code
        run: |
          echo "Compiling Java source code..."
          
          JAVA_SRC_DIR="java"
          BUILD_DIR="build/java_classes"
          JAR_FILE="build/outputs/aar/classes.jar"
          
          if [ -d "$JAVA_SRC_DIR" ]; then
            echo "Found Java source directory at: $JAVA_SRC_DIR"
            
            # List Java files
            echo "Java files found:"
            find "$JAVA_SRC_DIR" -name "*.java" -type f | head -20
            
            # Create build directory
            rm -rf $BUILD_DIR
            mkdir -p $BUILD_DIR
            
            # Find all Java source files
            JAVA_SOURCES=$(find "$JAVA_SRC_DIR" -name "*.java" -type f)
            
            if [ -n "$JAVA_SOURCES" ]; then
              echo "Compiling $(echo "$JAVA_SOURCES" | wc -l) Java source files..."
              
              # Create classpath - include Android SDK jars
              ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
              if [ ! -f "$ANDROID_JAR" ]; then
                # Try to find any android.jar
                ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" | head -1)
              fi
              
              if [ -f "$ANDROID_JAR" ]; then
                echo "Using Android SDK jar: $ANDROID_JAR"
                
                # Compile Java source files
                javac -d $BUILD_DIR \
                      -cp "$ANDROID_JAR" \
                      -source 1.8 \
                      -target 1.8 \
                      $(echo "$JAVA_SOURCES" | tr '\n' ' ')
                
                # Check if compilation was successful
                if [ $? -eq 0 ]; then
                  echo "Java compilation successful!"
                  
                  # Count compiled classes
                  CLASS_COUNT=$(find $BUILD_DIR -name "*.class" -type f | wc -l)
                  echo "Compiled $CLASS_COUNT class files"
                  
                  # Create JAR file
                  echo "Creating JAR file: $JAR_FILE"
                  
                  # Create manifest
                  mkdir -p $BUILD_DIR/META-INF
                  echo "Manifest-Version: 1.0" > $BUILD_DIR/META-INF/MANIFEST.MF
                  echo "Created-By: GitHub Actions" >> $BUILD_DIR/META-INF/MANIFEST.MF
                  
                  # Package JAR
                  jar cf $JAR_FILE -C $BUILD_DIR .
                  
                  echo "JAR file created successfully: $JAR_FILE"
                  echo "JAR size: $(du -h $JAR_FILE | cut -f1)"
                else
                  echo "Java compilation failed!"
                  exit 1
                fi
              else
                echo "ERROR: Android SDK jar not found!"
                echo "Tried to find at: $ANDROID_HOME/platforms/"
                exit 1
              fi
            else
              echo "WARNING: No Java source files found in $JAVA_SRC_DIR"
              # Create empty JAR file
              touch $JAR_FILE
            fi
          else
            echo "ERROR: Java source directory not found: $JAVA_SRC_DIR"
            exit 1
          fi

      - name: Create proguard rules (if needed)
        run: |
          echo "Creating proguard rules..."
          
          AAR_DIR="build/outputs/aar"
          PROGUARD_FILE="$AAR_DIR/proguard.txt"
          
          cat > $PROGUARD_FILE << 'EOF'
          # ProGuard rules for ONNX Runtime Extensions
          -keep class com.microsoft.onnxruntime.extensions.** { *; }
          -keep class ai.onnxruntime.extensions.** { *; }
          -keep class org.** { *; }
          
          # Keep native methods
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          
          # Keep JNI class
          -keep class * extends java.lang.Enum {
              *;
          }
          EOF
          
          echo "Proguard rules created: $PROGUARD_FILE"

      - name: Create R.txt file (required for AAR)
        run: |
          echo "Creating R.txt file..."
          
          AAR_DIR="build/outputs/aar"
          R_TXT="$AAR_DIR/R.txt"
          
          # Create minimal R.txt file
          cat > $R_TXT << 'EOF'
          int string app_name 0x7f040000
          EOF
          
          echo "R.txt created: $R_TXT"

      - name: Create public.txt file (optional for AAR)
        run: |
          echo "Creating public.txt file..."
          
          AAR_DIR="build/outputs/aar"
          PUBLIC_TXT="$AAR_DIR/public.txt"
          
          # Create minimal public.txt file
          echo "# Public symbols" > $PUBLIC_TXT
          echo "int string app_name" >> $PUBLIC_TXT
          
          echo "public.txt created: $PUBLIC_TXT"

      - name: Verify AAR structure
        run: |
          echo "Verifying AAR structure..."
          
          AAR_DIR="build/outputs/aar"
          
          echo "=== AAR Directory Structure ==="
          find $AAR_DIR -type f | sort
          echo ""
          
          echo "=== JNI Libraries ==="
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            COUNT=$(find $AAR_DIR/jni/$ABI -name "*.so" -type f 2>/dev/null | wc -l)
            echo "$ABI: $COUNT libraries"
            if [ $COUNT -gt 0 ]; then
              find $AAR_DIR/jni/$ABI -name "*.so" -type f | sort
            fi
          done
          echo ""
          
          echo "=== Java Classes ==="
          if [ -f "$AAR_DIR/classes.jar" ]; then
            echo "classes.jar exists, size: $(du -h $AAR_DIR/classes.jar | cut -f1)"
            echo "JAR contents:"
            jar tf $AAR_DIR/classes.jar | head -20
            echo "..."
          else
            echo "WARNING: classes.jar not found!"
          fi
          echo ""
          
          echo "=== Manifest ==="
          cat $AAR_DIR/AndroidManifest.xml
          echo ""

      - name: Package AAR file
        run: |
          echo "Packaging AAR file..."
          
          AAR_DIR="build/outputs/aar"
          OUTPUT_AAR="onnxruntime_extensions-android.aar"
          
          # Create the AAR file (it's just a zip with specific structure)
          cd $AAR_DIR
          
          echo "Packaging from directory: $(pwd)"
          echo "Contents to package:"
          find . -type f | sort
          
          # Create the AAR
          zip -r "../../$OUTPUT_AAR" ./*
          
          cd ../..
          
          echo ""
          echo "=== AAR Package Created ==="
          echo "File: $OUTPUT_AAR"
          echo "Size: $(du -h $OUTPUT_AAR | cut -f1)"
          
          # Verify AAR structure
          echo ""
          echo "=== AAR Contents ==="
          unzip -l $OUTPUT_AAR | sort

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-extensions-android-aar
          path: onnxruntime_extensions-android.aar
          retention-days: 7

      - name: Upload AAR directory (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aar-directory-structure
          path: build/outputs/aar
          retention-days: 7

  verify-summary:
    name: Build Verification Summary
    runs-on: ubuntu-latest
    needs: [verify-android-16kb-alignment, package-aar]
    if: always()
    
    steps:
      - name: Display summary
        run: |
          echo "=== Android Build Verification Summary ==="
          echo ""
          echo "Architecture Build Status:"
          echo "  arm64-v8a:    ${{ needs.verify-android-16kb-alignment.result == 'success' && '✅ PASS' || '❌ FAIL' }}"
          echo "  armeabi-v7a:  ${{ needs.verify-android-16kb-alignment.result == 'success' && '✅ PASS' || '❌ FAIL' }}"
          echo "  x86:          ${{ needs.verify-android-16kb-alignment.result == 'success' && '✅ PASS' || '❌ FAIL' }}"
          echo "  x86_64:       ${{ needs.verify-android-16kb-alignment.result == 'success' && '✅ PASS' || '❌ FAIL' }}"
          echo ""
          echo "AAR Packaging: ${{ needs.package-aar.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
          echo ""
          
          # Check if all builds passed
          if [[ "${{ needs.verify-android-16kb-alignment.result }}" == "success" ]] && [[ "${{ needs.package-aar.result }}" == "success" ]]; then
            echo "🎉 All Android architectures built successfully!"
            echo "📦 AAR package created: onnxruntime_extensions-android.aar"
            echo ""
            echo "Components included:"
            echo "  - Native libraries for 4 architectures (arm64-v8a, armeabi-v7a, x86, x86_64)"
            echo "  - Java classes from java/ directory"
            echo "  - AndroidManifest.xml"
            echo "  - Required AAR metadata files"
            echo ""
            echo "Note: libonnxruntime.so uses 4KB alignment by default"
            echo "      Extension libraries use 16KB alignment for Android compatibility"
          else
            echo "⚠️  Some builds or packaging steps failed"
            echo "Check the individual job logs for details"
            exit 1
          fi
